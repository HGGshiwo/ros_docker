services:
  desktop:
    ports:
      - "${WEB_PORT:-6080}:6080"    # noVNC web 访问端口
      - "${VNC_PORT:-5901}:5901"    # VNC 客户端直连端口 (可选)
      - "${MQTT_PORT:-41883}:41883"  # mqtt 连接端口
      - "${HTTP_PORT:-8000}:8000" # http 接口
      - "${RTSP_PORT:-8554}:8554" # rtsp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - FCU_URL=tcp://${MJPG_HOST}:5760
      - MQTT_HOST=host.docker.internal
      - MJPG_HOST=${MJPG_HOST}
      - MJPG_PORT=${MJPG_PORT:-8090}
